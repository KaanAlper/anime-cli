[package]
name = "anime-cli"
version = "1.0.0"
edition = "2024"
description = "Terminalde Türkçe altyazılı anime arama ve izleme aracı (AnimeciX, Anizle, TürkAnime Arşiv)"

[[bin]]
name = "anime"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
urlencoding = "2"
